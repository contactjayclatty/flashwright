# Platform-tools allow/block list. Compiled into flashwright-tools.
# Block: refuse the tools, including for a scan.
# Allow: required before any plan that writes. An entry stays scan-only
# until a device test records the per-file SHA-256s and sets device_tested.
# 37.0.1 is the only allow-list entry. Its zip SHA-1 is the checksum Google
# publishes for platform-tools_r37.0.1-win.zip. Per-file SHA-256s are empty
# until that device test, so writes stay off.

[block]
below = "33.0.3"

[[block.ranges]]
from = "34.0.0"
to = "34.0.4"

[[block.exact]]
version = "36.0.2"
any_build = true

[[allow]]
version = "37.0.1"
zip_sha1 = "e03e78b1d80b396f1c3358e31251cb31740e1110"
device_tested = false
adb_sha256 = ""
fastboot_sha256 = ""
parser_profile = "pt-37"
