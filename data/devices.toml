# Fallback when a live init_boot probe is inconclusive (spec §3.3).
# These rows are public device facts used by the fixtures:
# Pixel 8 (shiba) has init_boot; Pixel 6 (oriole) does not.
# Pixel 9 Pro XL (komodo) patches init_boot.
# The longer upstream device table was not copied.

[[device]]
codename = "shiba"
model = "Pixel 8"
has_init_boot = true

[[device]]
codename = "oriole"
model = "Pixel 6"
has_init_boot = false

[[device]]
codename = "komodo"
model = "Pixel 9 Pro XL"
has_init_boot = true
