# Fallback when a live init_boot probe is inconclusive.
# Pixel 8 (shiba) has init_boot; Pixel 6 (oriole) does not.
# Pixel 9 Pro XL (komodo) is an A/B phone and an init_boot target.
# The full compatibility table is data/device_compatibility.toml.

[[device]]
codename = "shiba"
model = "Pixel 8"
has_init_boot = true

[[device]]
codename = "oriole"
model = "Pixel 6"
has_init_boot = false

[[device]]
codename = "komodo"
model = "Pixel 9 Pro XL"
has_init_boot = true
