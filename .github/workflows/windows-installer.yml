name: Windows installer

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/flashwright-gui/ui/package-lock.json
      - name: Test the workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Static checks
        run: cargo run -p xtask -- check
      - name: Wizard bundle
        working-directory: apps/flashwright-gui/ui
        run: npm ci && npm run build
      - name: Theme boundary
        run: node scripts/check-theme-boundary.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/flashwright-gui/package-lock.json
            apps/flashwright-gui/ui/package-lock.json
      - name: Install Tauri CLI
        working-directory: apps/flashwright-gui
        run: npm ci
      - name: Install wizard UI
        working-directory: apps/flashwright-gui/ui
        run: npm ci
      - name: Window keyboard and scale checks
        working-directory: apps/flashwright-gui/ui
        run: npm test
      - name: Install a compiler new enough for the window shell
        run: rustup toolchain install stable
      - name: Build NSIS installer
        working-directory: apps/flashwright-gui
        env:
          # rust-toolchain.toml stays on 1.88 for the device-layer snapshots.
          # The window shell's Tauri crates need the stable compiler.
          RUSTUP_TOOLCHAIN: stable
        run: npx tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: flashwright-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Record installer size
        shell: pwsh
        run: |
          $candidates = @(
            "target/release/bundle/nsis",
            "apps/flashwright-gui/src-tauri/target/release/bundle/nsis"
          )
          $bundle = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $files = @()
          if ($bundle) {
            $files = @(Get-ChildItem -Path $bundle -File)
          }
          $lines = @("### Windows NSIS", "", "| File | Bytes |", "| --- | ---: |")
          foreach ($file in $files) {
            $lines += "| $($file.Name) | $($file.Length) |"
          }
          if (-not $files) {
            $lines += "| (none) | 0 |"
            $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            throw "NSIS bundle was not produced"
          }
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $files | ForEach-Object { Write-Output "$($_.FullName) $($_.Length)" }
      - name: Capture the WebView2 log
        shell: pwsh
        run: |
          $candidates = @(
            "target/release/flashwright-gui.exe",
            "apps/flashwright-gui/src-tauri/target/release/flashwright-gui.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "The window executable was not produced" }
          $log = Join-Path $env:RUNNER_TEMP "webview2.log"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--enable-logging --v=1 --log-file=`"$log`""
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $alive = -not $proc.HasExited
          if (-not $alive) {
            Write-Output "window exit code $($proc.ExitCode)"
          }
          if (Test-Path $log) {
            Get-Content $log -TotalCount 40
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "WebView2 log captured ($((Get-Item $log).Length) bytes)."
          } elseif ($alive) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "The window stayed open. WebView2 did not write a log file."
          }
          if ($alive) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $alive -and -not (Test-Path $log)) {
            throw "The window exited before a WebView2 log was written"
          }
