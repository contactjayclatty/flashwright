[workspace]
resolver = "2"
members = [
    "crates/flashwright-proc",
    "crates/flashwright-tools",
    "crates/flashwright-device",
    "crates/flashwright-winusb",
    "crates/flashwright-core",
    "crates/flashwright-firmware",
    "crates/flashwright-plan",
    "crates/flashwright-firmware",
    "crates/flashwright-magisk",
    "crates/flashwright-bootimg",
    "apps/flashwright-gui/src-tauri",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Clatty Works"]
repository = "https://github.com/contactjayclatty/flashwright"
rust-version = "1.88"
publish = false

[workspace.dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Kept at 0.8.23 so the window shell's older parser crates stay beside it.
toml = "=0.8.23"
sha2 = "0.10"
sha1 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "safe-decode", "std"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tracing = "0.1"
libc = "0.2"
serde_json = "1"
serde_jcs = "0.1"
uuid = { version = "=1.11.0", features = ["v7", "serde"] }
proptest = "1"
trybuild = "1"
syn = { version = "2", features = ["full", "visit"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
